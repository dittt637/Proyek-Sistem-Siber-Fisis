# Broker MQTT lokal (development). Jalankan: docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: greenhouse-broker
    ports: ["1883:1883", "9001:9001"]   # 1883 = MQTT (ESP32, backend), 9001 = WebSocket (dashboard)
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data   # agar pesan retained bertahan setelah restart
volumes:
  mosquitto-data:
